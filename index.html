<script type="module">
  import QrScanner from './js/qr-scanner.min.js';
  QrScanner.WORKER_PATH = 'https://kouseicalender.github.io/qr-reader/js/qr-scanner-worker.min.js';

  const video = document.getElementById('video');
  const log = document.getElementById('log');
  const cameraSelect = document.getElementById('camera-select');
  let scanner;

  function addLog(text) {
    const time = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.innerHTML = `<div><strong>${text}</strong></div><div class="timestamp">${time}</div>`;
    log.prepend(entry);
  }

  // 最初に自動カメラ起動（ラベルなし）
  QrScanner.listCameras().then(cameras => {
    if (cameras.length === 0) {
      addLog('利用可能なカメラが見つかりません。');
      return;
    }

    // 最初のカメラでスキャン開始
    startScanner(cameras[0].id).then(() => {
      // ✅ 起動後にラベル付きのカメラ一覧を再取得
      QrScanner.listCameras(true).then(camerasWithLabels => {
        cameraSelect.innerHTML = ''; // 一旦リセット
        camerasWithLabels.forEach((camera, index) => {
          const option = document.createElement('option');
          option.value = camera.id;
          option.text = camera.label || `カメラ ${index + 1}`;
          cameraSelect.appendChild(option);
        });
        cameraSelect.value = cameras[0].id;
      });
    });
  });

  // カメラ切り替え時
  cameraSelect.addEventListener('change', () => {
    if (scanner) {
      scanner.stop().then(() => {
        startScanner(cameraSelect.value);
      });
    }
  });

  function startScanner(cameraId) {
    scanner = new QrScanner(video, result => {
      addLog(result);
    }, {
      deviceId: cameraId,
      highlightScanRegion: true,
      highlightCodeOutline: true
    });
    return scanner.start().catch(err => {
      addLog(`カメラ起動エラー: ${err.message}`);
    });
  }
</script>
