<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QRコードリーダー（カメラ選択＆重複防止）</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f0f0f0; }
    #controls { padding: 1em; background: #fff; text-align: center; }
    #video { width: 100%; background: black; }
    #log { padding: 1em; background: white; height: 40vh; overflow-y: scroll; font-size: 1.2em; }
    .entry { margin-bottom: 0.5em; }
    .timestamp { color: #888; font-size: 0.9em; }
  </style>
</head>
<body>

  <div id="controls">
    <label for="camera-select">カメラ選択：</label>
    <select id="camera-select"></select>
  </div>

  <video id="video" autoplay muted playsinline></video>
  <div id="log"></div>

  <script type="module">
    import QrScanner from 'https://unpkg.com/qr-scanner@1.4.2/qr-scanner.min.js';
    QrScanner.WORKER_PATH = 'https://unpkg.com/qr-scanner@1.4.2/qr-scanner-worker.min.js';

    const video = document.getElementById('video');
    const log = document.getElementById('log');
    const cameraSelect = document.getElementById('camera-select');
    let scanner;
    let lastScannedText = '';
    let lastScannedTime = 0;

    function addLog(text) {
      const now = Date.now();
      if (text === lastScannedText && now - lastScannedTime < 3000) return;

      lastScannedText = text;
      lastScannedTime = now;

      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'entry';

      const isUrl = /^https?:\/\/.+/i.test(text);
      const content = isUrl
        ? `<a href="${text}" target="_blank">${text}</a>`
        : `<span>${text}</span>`;

      entry.innerHTML = `<div>${content}</div><div class="timestamp">${time}</div>`;
      log.prepend(entry);
    }

    function startScanner(cameraId) {
      scanner = new QrScanner(video, result => {
        addLog(result);
      }, {
        deviceId: cameraId,
        highlightScanRegion: true,
        highlightCodeOutline: true
      });
      return scanner.start().catch(err => {
        addLog(`カメラ起動エラー: ${err.message}`);
      });
    }

    QrScanner.listCameras().then(cameras => {
      if (cameras.length === 0) {
        addLog('利用可能なカメラが見つかりません。');
        return;
      }

      startScanner(cameras[0].id).then(() => {
        QrScanner.listCameras(true).then(camerasWithLabels => {
          cameraSelect.innerHTML = '';
          camerasWithLabels.forEach((camera, index) => {
            const option = document.createElement('option');
            option.value = camera.id;
            option.text = camera.label || `カメラ ${index + 1}`;
            cameraSelect.appendChild(option);
          });
          cameraSelect.value = cameras[0].id;
        });
      });
    });

    cameraSelect.addEventListener('change', () => {
      if (scanner) {
        scanner.stop().then(() => {
          startScanner(cameraSelect.value);
        });
      }
    });
  </script>
</body>
</html>
