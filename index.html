<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QRコードリーダー（カメラ選択あり）</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
    }
    #controls {
      padding: 1em;
      background: #fff;
      text-align: center;
    }
    #video {
      width: 100%;
      background: black;
    }
    #log {
      padding: 1em;
      background: white;
      height: 40vh;
      overflow-y: scroll;
      font-size: 1.2em;
    }
    .entry {
      margin-bottom: 0.5em;
    }
    .timestamp {
      color: #888;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <div id="controls">
    <label for="camera-select">カメラ選択：</label>
    <select id="camera-select"></select>
  </div>

  <video id="video" autoplay muted playsinline></video>
  <div id="log"></div>

  <script type="module">
    import QrScanner from './js/qr-scanner.min.js';
    QrScanner.WORKER_PATH = 'https://kouseicalender.github.io/qr-reader/js/qr-scanner-worker.min.js';

    const video = document.getElementById('video');
    const log = document.getElementById('log');
    const cameraSelect = document.getElementById('camera-select');
    let scanner;

    const scannedSet = new Set();

    // カメラ一覧を取得してセレクトボックスに追加
    QrScanner.listCameras(true).then(cameras => {
      cameras.forEach((camera, index) => {
        const option = document.createElement('option');
        option.value = camera.id;
        option.text = camera.label || `カメラ ${index + 1}`;
        cameraSelect.appendChild(option);
      });

        startScanner(cameras[0].id); // 初期カメラ起動
      }
    });
