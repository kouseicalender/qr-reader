<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QRコードリーダー</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
    }
    #video {
      width: 100%;
      height: auto;
      background: black;
    }
    #log {
      padding: 1em;
      background: white;
      height: 50vh;
      overflow-y: scroll;
      font-size: 1.2em;
    }
    .entry {
      margin-bottom: 0.5em;
    }
    .timestamp {
      color: #888;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <div id="log"></div>

  <script type="module">
    import QrScanner from './js/qr-scanner.min.js';

    // 👇これがないと動かない！
    QrScanner.WORKER_PATH = 'https://kouseicalender.github.io/qr-reader/js/qr-scanner-worker.min.js';

    const video = document.getElementById('video');
    const log = document.getElementById('log');
    const scannedSet = new Set();

    const scanner = new QrScanner(video, result => {
      if (!scannedSet.has(result)) {
        scannedSet.add(result);
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = 'entry';
        entry.innerHTML = `<div><strong>${result}</strong></div><div class="timestamp">${time}</div>`;
        log.prepend(entry);
      }
    });

    scanner.start();
  </script>
</body>
</html>
